<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden · Renten-Fachbot</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<header th:replace="~{fragments/layout :: header('Anmeldung', false)}"></header>
<div class="login-stage">
<main class="login-card">
  <div class="login-brand">
    <div><h1 class="login-title">Renten<strong>|</strong>Fachbot</h1><p class="login-intro">Intern · nur Team &amp; Fachbereich</p></div>
  </div>
  <h2 class="login-heading">Willkommen zurück</h2>
  <p class="login-description">Melden Sie sich an, um auf den Fachwissen-Assistenten zuzugreifen.</p>
  <p class="login-footnote">Anmeldung und Benutzerverwaltung erfolgen über den zentralen Keycloak-Identity-Provider.</p>
  <div class="login-actions">
    <a id="keycloakLogin" class="button button-primary login-submit" th:href="@{/oauth2/authorization/keycloak}">Anmelden</a>
  </div>
</main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
